# Pushing a tag like v1.2.0 tests, builds and publishes BlaskSync.app as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Xcode 26.6's compiler crashes on ManualControlView, so build with 27.1, the version used locally.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          # All tags, so the update's release notes can list the commits since the previous one.
          fetch-depth: 0

      - name: Test
        run: swift test

      # Signing with the same self-signed certificate every time keeps macOS permissions across updates.
      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build app
        env:
          SIGN_IDENTITY: Blask Sync Release Signing
          VARIANT: release
          UNIVERSAL: "1"
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/bundle.sh release

      - name: Zip
        run: ditto -c -k --keepParent build/BlaskSync.app "BlaskSync-${GITHUB_REF_NAME}.zip"

      # The app's updater reads appcast.xml from the latest release; the zip's signature proves the update is ours.
      - name: Make update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          ZIP="BlaskSync-${GITHUB_REF_NAME}.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          scripts/make-appcast.sh "$ZIP" "${GITHUB_REF_NAME#v}" "$BUILD_NUMBER" "$URL" "$GITHUB_REF_NAME" > appcast.xml
          rm "$SPARKLE_KEY_FILE"
          cat appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "BlaskSync-${GITHUB_REF_NAME}.zip" appcast.xml --title "Blask Sync ${GITHUB_REF_NAME#v}" --generate-notes
